server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 20
    max-connections: 10000

spring:
  application:
    name: ludence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ludence}
    username: ${DB_USERNAME:ludence}
    password: ${DB_PASSWORD:ludence}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

storage:
  image-directory: ${IMAGE_STORAGE_DIRECTORY:./data/images}

auth:
  jwt:
    secret: ${JWT_SECRET:ludence-local-jwt-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
