services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    environment:
      POSTGRES_DB: ludens
      POSTGRES_USER: ludens
      POSTGRES_PASSWORD: ludens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludens -d ludens"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      DB_URL: jdbc:postgresql://db:5432/ludens
      DB_USERNAME: ludens
      DB_PASSWORD: ludens
      JPA_DDL_AUTO: update
      IMAGE_STORAGE_DIRECTORY: /data/images
    ports:
      - "8080:8080"
    volumes:
      - image-data:/data/images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  image-data:
